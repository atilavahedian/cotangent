[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotangent-research"
version = "0.6.0"
description = "Numerically matched gradient batching for efficient training on Apple Metal"
authors = [{name = "Atila Vahedian"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=2.0", "psutil>=6", "pyarrow>=17"]

[project.optional-dependencies]
research = ["pytest>=8", "matplotlib>=3.9", "mpmath>=1.3"]

[project.urls]
Repository = "https://github.com/atilavahedian/cotangent"
Research = "https://atilavahedian.github.io/cotangent/"

[tool.setuptools.packages.find]
include = ["cotangent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
