[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotangent-research"
version = "0.5.0"
description = "Numerically matched gradient handling for exact transformer training"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "numpy>=2.0", "psutil>=6", "pyarrow>=17"]

[project.optional-dependencies]
research = ["pytest>=8", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["cotangent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
